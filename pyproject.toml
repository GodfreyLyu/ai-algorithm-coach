# Describe the local package, its runtime, and the command line entry point.
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-algorithm-coach"
version = "0.4.0"
description = "A local, reliable algorithm training loop for AI Skills."
readme = "README.md"
requires-python = ">=3.12"
license = {file = "LICENSE"}
dependencies = []

[project.scripts]
algorithm-coach = "algorithm_coach.cli:main"
algorithm-coach-web = "algorithm_coach.http_api:main"

[project.optional-dependencies]
web = ["fastapi>=0.115,<1", "pydantic>=2.10,<3", "uvicorn>=0.30,<1"]
web-test = ["httpx>=0.28,<1"]

[tool.setuptools.packages.find]
where = ["src"]

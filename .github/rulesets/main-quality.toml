# File purpose: Require PRs, owner review for contributions, and named CI checks for main.
name = "Main quality and owner approval"
target = "branch"
enforcement = "active"
bypass_actors = []

[conditions.ref_name]
include = ["refs/heads/main"]
exclude = []

[[rules]]
type = "deletion"

[[rules]]
type = "non_fast_forward"

[[rules]]
type = "pull_request"

[rules.parameters]
allowed_merge_methods = ["merge", "squash", "rebase"]
dismiss_stale_reviews_on_push = true
require_code_owner_review = true
require_extra_approval_for_unattributed_changes = false
require_last_push_approval = false
# Code owner review still applies to PRs opened by other authors.
required_approving_review_count = 0
required_review_thread_resolution = true

[[rules]]
type = "required_status_checks"

[rules.parameters]
strict_required_status_checks_policy = true
required_status_checks = [
  { context = "Python syntax", integration_id = 15368 },
  { context = "Workflow syntax", integration_id = 15368 },
  { context = "Logic tests", integration_id = 15368 },
  { context = "Documentation content", integration_id = 15368 },
]
